<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServiceOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --step: #EEF3F6;
    --step-2: #E2EAEF;
    --ink: #0B1720;
    --soft: #4B5862;
    --faint: #7C8891;
    --water: #0A5C8A;
    --water-strong: #08496E;
    --water-tint: #E1EEF6;
    --on-water: #FFFFFF;
    --ok: #157347;
    --ok-tint: #DDF0E5;
    --wait: #8A4B12;
    --wait-tint: #F7E8D6;
    --danger: #B23A2E;
    --danger-tint: #F8E4E1;
    --line: #C9D4DB;
    --night: #0B1720;
    --font: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1218;
      --step: #16212A;
      --step-2: #1E2C37;
      --ink: #E8EEF2;
      --soft: #A9B6C0;
      --faint: #74828D;
      --water: #1F7BB8;
      --water-strong: #3A92CC;
      --water-tint: #13293A;
      --ok: #7BC69A;
      --ok-tint: #17291F;
      --wait: #E3A15C;
      --wait-tint: #2E2416;
      --danger: #E48579;
      --danger-tint: #36201D;
      --line: #33444F;
      --night: #05090C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1218; --step: #16212A; --step-2: #1E2C37; --ink: #E8EEF2; --soft: #A9B6C0; --faint: #74828D;
    --water: #1F7BB8; --water-strong: #3A92CC; --water-tint: #13293A; --ok: #7BC69A; --ok-tint: #17291F;
    --wait: #E3A15C; --wait-tint: #2E2416; --danger: #E48579; --danger-tint: #36201D; --line: #33444F; --night: #05090C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 3px solid var(--water-strong); outline-offset: 2px; }

  /* ---------- frame ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
  .topbar .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; background: none; border: 0; padding: 4px 0; color: inherit; font-family: inherit; cursor: pointer; }
  .tabnav { display: flex; gap: 8px; margin: 4px 0 16px; }
  .tabnav button { flex: 1; padding: 10px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .tabnav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
  .topbar .who { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--soft); }
  .chipbtn { border: 0; background: var(--step); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  @media (max-width: 480px) { .topbar .who .name { display: none; } }
  .chipbtn:active { transform: scale(.97); }
  main { max-width: 560px; margin: 0 auto; padding: 4px 16px 64px; }
  main.wide { max-width: 1200px; }
  .page-title { font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; margin: 12px 0 4px; font-weight: 700; }
  .page-sub { color: var(--soft); margin: 0 0 18px; }
  .section-title { font-size: 20px; letter-spacing: -0.01em; font-weight: 700; margin: 28px 0 10px; }
  .muted { color: var(--soft); }
  .small { font-size: 14px; }
  .empty { background: var(--step); border-radius: 18px; padding: 20px; color: var(--soft); }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 999px; padding: 16px 18px; font-size: 17px; font-weight: 600; transition: transform .15s ease, opacity .15s ease, background .15s ease; }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-water { background: var(--water); color: var(--on-water); }
  .btn-ink { background: var(--ink); color: var(--bg); }
  .btn-soft { background: var(--step); color: var(--ink); }
  .btn-small { width: auto; padding: 10px 16px; font-size: 15px; }
  .linkbtn { border: 0; background: none; padding: 6px 0; color: var(--water-strong); font-weight: 600; font-size: 15px; }

  /* ---------- status words ---------- */
  .status { display: inline-block; font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .status.pending { background: var(--step); color: var(--soft); }
  .status.submitted, .status.sent { background: var(--wait-tint); color: var(--wait); }
  .status.approved, .status.paid { background: var(--ok-tint); color: var(--ok); }
  .status.invoiced { background: var(--water-tint); color: var(--water-strong); }

  /* ---------- lists ---------- */
  .jobrow { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: var(--step); border-radius: 18px; padding: 14px 16px; margin-bottom: 8px; text-align: left; transition: background .15s ease; }
  .jobrow:hover { background: var(--step-2); }
  .jobrow .thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
  .jobrow .txt { min-width: 0; flex: 1; }
  .jobrow b { display: block; font-size: 18px; letter-spacing: -0.01em; }
  .jobrow .line { display: block; color: var(--soft); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jobrow .status.pending { background: var(--bg); }

  /* ---------- contractor job ---------- */
  .cam { position: relative; display: block; width: calc(100% + 32px); margin: 0 -16px; height: 300px; border: 0; background: var(--night); color: #fff; text-align: left; }
  .cam .lbl { position: absolute; top: 20px; left: 20px; right: 20px; }
  .cam .lbl b { display: block; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; }
  .cam .lbl span { color: #B9C6CF; font-size: 15px; }
  .cam .ring { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); width: 88px; height: 88px; border-radius: 50%; background: #fff; display: grid; place-items: center; transition: transform .15s ease; }
  .cam:active .ring { transform: translate(-50%, -50%) scale(.92); }
  .cam .ring i { width: 70px; height: 70px; border-radius: 50%; background: var(--water); display: block; }
  .cam .count { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: #B9C6CF; font-size: 15px; }
  .cam.readonly { height: auto; padding: 20px; cursor: default; }
  .cam.readonly .lbl { position: static; }
  .back { position: absolute; top: 14px; right: 14px; z-index: 2; border: 0; border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 600; }
  .film { display: flex; gap: 8px; padding: 12px 0; overflow-x: auto; }
  .film .ph { position: relative; flex-shrink: 0; }
  .film img { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; }
  .film .ph.uploading img { opacity: .5; }
  .film .ph .tag { position: absolute; left: 4px; bottom: 4px; right: 4px; text-align: center; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 6px; background: rgba(11,23,32,.8); color: #fff; }
  .film .ph.failed .tag { background: var(--danger); }
  .film .ph button { border: 0; padding: 0; background: none; display: block; }
  .film .none { color: var(--soft); font-size: 15px; padding: 28px 0; }
  .note-box { background: var(--wait-tint); color: var(--ink); border-radius: 16px; padding: 12px 14px; margin: 4px 0 8px; }
  .check { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; padding: 14px 4px; min-height: 60px; font-size: 17px; text-align: left; }
  .check .tick { width: 30px; height: 30px; border-radius: 9px; background: var(--step); box-shadow: inset 0 0 0 2px var(--line); flex-shrink: 0; display: grid; place-items: center; transition: background .15s ease, transform .15s ease; }
  .check .tick svg { width: 18px; height: 18px; stroke: #fff; opacity: 0; }
  .check[aria-pressed="true"] .tick { background: var(--water); box-shadow: none; }
  .check[aria-pressed="true"] .tick svg { opacity: 1; }
  .check:active .tick { transform: scale(.9); }
  .check[disabled] { cursor: default; }
  textarea, input[type=text], input[type=tel], input[type=email], input[type=password], input[inputmode], select {
    width: 100%; border: 0; background: var(--step); border-radius: 14px; padding: 14px; font-size: 16px; color: var(--ink);
  }
  textarea { min-height: 84px; resize: vertical; }
  .field { margin-bottom: 14px; }
  .field label, .field .label { display: block; font-size: 15px; font-weight: 600; margin: 0 0 6px 2px; }
  .field .help { font-size: 14px; color: var(--soft); margin: 6px 0 0 2px; }
  .stamp { font-size: 14px; color: var(--soft); margin: 10px 0; }
  .sticky-cta { position: sticky; bottom: 0; padding: 12px 0 16px; background: var(--bg); }

  /* ---------- owner ---------- */
  .owner-grid { display: block; }
  .review { background: var(--step); border-radius: 22px; overflow: hidden; margin-bottom: 14px; }
  .review .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .review .ba.one { grid-template-columns: 1fr; }
  .review figure { margin: 0; position: relative; }
  .review figure img { width: 100%; height: 220px; object-fit: cover; }
  .review figcaption { position: absolute; left: 10px; bottom: 10px; background: rgba(11,23,32,.78); color: #fff; font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .review .body { padding: 16px; }
  .review .body b { display: block; font-size: 22px; letter-spacing: -0.015em; line-height: 1.1; }
  .review .body p { margin: 4px 0 0; color: var(--soft); }
  .review .quote { margin-top: 10px; color: var(--ink); }
  .review .acts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; padding: 0 16px 16px; }
  .review .btn-soft { background: var(--bg); }
  .more-photos { display: flex; gap: 4px; padding: 3px 0 0; overflow-x: auto; }
  .more-photos img { width: 64px; height: 64px; object-fit: cover; flex-shrink: 0; }
  .side .panel { background: var(--step); border-radius: 22px; padding: 16px; margin-bottom: 12px; }
  .panel b.big { display: block; font-size: 22px; letter-spacing: -0.015em; line-height: 1.15; }
  .panel .contact { color: var(--soft); font-size: 15px; margin: 2px 0 10px; overflow-wrap: anywhere; }
  .billjob { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--bg); border-radius: 14px; padding: 12px; margin-bottom: 6px; text-align: left; font-size: 16px; }
  .billjob .tick { width: 26px; height: 26px; border-radius: 8px; background: var(--step-2); box-shadow: inset 0 0 0 2px var(--line); flex-shrink: 0; display: grid; place-items: center; }
  .billjob .tick svg { width: 16px; height: 16px; stroke: #fff; opacity: 0; }
  .billjob[aria-pressed="true"] .tick { background: var(--water); box-shadow: none; }
  .billjob[aria-pressed="true"] .tick svg { opacity: 1; }
  .billjob span.grow { flex: 1; min-width: 0; }
  .via { display: flex; gap: 6px; margin: 10px 0 12px; flex-wrap: wrap; }
  .via button { border: 0; border-radius: 999px; padding: 10px 16px; background: var(--bg); font-size: 15px; font-weight: 600; }
  .via button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .via button[disabled] { opacity: .4; cursor: not-allowed; }
  .invrow { background: var(--bg); border-radius: 14px; padding: 12px; margin-bottom: 6px; }
  .invrow .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .invrow .top b { font-size: 17px; }
  .invrow .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .fallback { background: var(--wait-tint); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
  .fallback .acts { margin-top: 8px; }
  .fallback a { text-decoration: none; }
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .seg button { border: 0; border-radius: 12px; padding: 12px 8px; background: var(--step); font-size: 15px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  /* ---------- client bill ---------- */
  .bill { margin-bottom: 28px; }
  .bill .hero { position: relative; border-radius: 22px; overflow: hidden; background: var(--night); }
  .bill .hero img { width: 100%; height: 320px; object-fit: cover; }
  .bill .hero .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 18px 16px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.62)); }
  .bill .hero .over b { display: block; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; }
  .bill .hero .over span { font-size: 15px; opacity: .92; }
  .bill .hero.nophoto { padding: 24px 18px; color: #fff; }
  .bill .hero.nophoto b { display: block; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; }
  .bill .hero.nophoto span { color: #B9C6CF; }
  .bill .total { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 18px 0 4px; }
  .bill .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 12px 0; }
  .bill .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
  .bill .lines { background: var(--step); border-radius: 16px; padding: 6px 14px; margin: 12px 0; }
  .bill .lines div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .bill .lines .t { font-weight: 700; }
  .opts { display: grid; gap: 8px; margin: 12px 0; }
  .opts button { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; background: var(--step); border-radius: 18px; padding: 16px 18px; font-size: 17px; text-align: left; }
  .opts button small { display: block; color: var(--soft); font-size: 14px; }
  .opts button[aria-pressed="true"] { background: var(--water); color: var(--on-water); }
  .opts button[aria-pressed="true"] small { color: #CFE4F2; }
  .paidnote { background: var(--ok-tint); color: var(--ink); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }

  /* ---------- login ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 380px; }
  .login-card h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 4px; }
  .login-error { color: var(--danger); font-size: 15px; min-height: 22px; margin: 0 2px 8px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); font-size: 15px; padding: 12px 18px; border-radius: 999px; z-index: 50; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--danger); color: #fff; }
  .reset-link { text-align: center; margin-top: 32px; }

  /* ---------- computer layouts ---------- */
  @media (min-width: 960px) {
    .topbar { padding: 16px 32px; }
    main.wide { padding: 8px 32px 64px; }
    .owner-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; align-items: start; }
    .owner-grid .side { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; }
    .reviews { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .reviews .review { margin: 0; }
    .page-title { font-size: 40px; }
    main.payw { max-width: 1040px; }
    .bill.wide { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: start; }
    .bill.wide .hero img { height: 460px; }
    .bill.wide .total { margin-top: 0; }
    main.job { max-width: 1040px; }
    .jobgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
    .jobgrid .cam { width: 100%; margin: 0; border-radius: 22px; overflow: hidden; height: 360px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    fallback: {},      // invoiceId -> { channels, link, message } when automatic sending didn't happen
    payMethod: {}      // invoiceId -> "bank" | "card"
  };

  // Left over from the old hardcoded logins.
  forget("po_current_user");
  forget("po_role");

  // ---------- small helpers ----------

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function money(n) { return "$" + Number(n || 0).toFixed(2); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function cardFee(subtotal) { return round2(subtotal * CARD_FEE_RATE); }
  function token() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    return Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  }
  function shortDate(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : ""; }
  function timeOf(iso) { return iso ? new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : ""; }
  function addDays(iso, days) { return new Date(new Date(iso).getTime() + days * 86400000).toISOString(); }
  function payLink(inv) { return window.location.origin + "/?pay=" + encodeURIComponent(inv.payToken); }
  function digits(phone) { return String(phone || "").replace(/[^\d+]/g, ""); }

  // Supabase calls resolve with { error } instead of rejecting; turn that into a rejection.
  function dbq(query) {
    return Promise.resolve(query).then(function (res) {
      if (res && res.error) throw res.error;
      return res;
    });
  }

  function errorText(err) {
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      return "You're offline. Nothing was saved. Try again when you have signal.";
    }
    if (err && err.userMessage) return err.userMessage;
    var msg = err && err.message ? err.message : "Something went wrong";
    return "Couldn't save: " + msg + ". Please try again.";
  }

  // Runs a save with the button locked, and puts the button back with a message if it fails.
  function withBusy(btn, busyLabel, work) {
    var original = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = busyLabel; }
    return Promise.resolve().then(work).catch(function (err) {
      console.error(err);
      toast(errorText(err), true);
      if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = original; }
    });
  }

  function toast(msg, bad) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.toggle("bad", !!bad);
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.remove("show"); }, bad ? 4200 : 2600);
  }

  function clientById(id) {
    for (var i = 0; i < state.clients.length; i++) if (state.clients[i].id === id) return state.clients[i];
    return null;
  }
  function jobById(id) {
    for (var i = 0; i < state.jobs.length; i++) if (state.jobs[i].id === id) return state.jobs[i];
    return null;
  }
  function invoiceById(id) {
    for (var i = 0; i < state.invoices.length; i++) if (state.invoices[i].id === id) return state.invoices[i];
    return null;
  }
  function serviceLabel(job) { return PRICES[job.serviceType] ? PRICES[job.serviceType].label : job.serviceType; }
  function contractorLabel(username) {
    if (!username) return "Unassigned";
    return state.contractors[username] || username;
  }
  function photosOf(jobId) {
    var sub = state.submissions[jobId];
    return sub && sub.photos ? sub.photos : [];
  }

  // Which channels a client can be reached on, and which they prefer.
  function channelsFor(client) {
    var out = [];
    if (client && client.phone) out.push("sms");
    if (client && client.email) out.push("email");
    return out;
  }
  function preferredChannels(client) {
    var available = channelsFor(client);
    var pref = client && client.preferred_contact;
    var wanted = pref === "both" ? ["sms", "email"] : pref === "email" ? ["email"] : ["sms"];
    var picked = wanted.filter(function (c) { return available.indexOf(c) !== -1; });
    return picked.length ? picked : available.slice(0, 1);
  }
  function channelWords(channels) {
    return channels.map(function (c) { return c === "sms" ? "text" : "email"; }).join(" and ");
  }

  // ---------- rows <-> state ----------

  function jobFromRow(r) {
    return { id: r.id, clientId: r.client_id, serviceType: r.service_type, status: r.status, price: Number(r.price), notes: r.notes || "", assignedTo: r.assigned_to || null };
  }
  function invoiceFromRow(r) {
    return {
      id: r.id, clientId: r.client_id, jobIds: r.job_ids || [], payMethod: r.pay_method,
      subtotal: Number(r.subtotal), surcharge: Number(r.surcharge || 0), total: Number(r.total),
      sentAt: r.sent_at, status: r.status, paidAt: r.paid_at,
      payToken: r.pay_token, sentVia: r.sent_via || [], photosExpireAt: r.photos_expire_at
    };
  }
  function submissionFromRow(r) {
    return {
      checklist: r.checklist || {}, notes: r.notes || "", photos: r.photos || [],
      geo: (r.geo_lat && r.geo_lng) ? { lat: r.geo_lat, lng: r.geo_lng } : null,
      timestamp: r.submitted_at, photosDeletedAt: r.photos_deleted_at || null
    };
  }

  function seedDatabase() {
    return dbq(sb.from("clients").insert(SEED_CLIENTS)).then(function () {
      return dbq(sb.from("jobs").insert(SEED_JOBS.map(function (j) {
        return { id: j.id, client_id: j.clientId, service_type: j.serviceType, status: j.status, price: PRICES[j.serviceType].defaultPrice };
      })));
    });
  }

  // The database only returns what this login may see (row level security), so each role loads differently.
  function loadAll() {
    state.loading = true;
    state.loadError = "";
    render();
    if (state.role === "contractor") return loadContractor();
    return Promise.all([
      dbq(sb.from("clients").select("*")),
      dbq(sb.from("jobs").select("*")),
      dbq(sb.from("job_submissions").select("*")),
      dbq(sb.from("invoices").select("*")),
      dbq(sb.rpc("contractor_names"))
    ]).then(function (results) {
      if (results[0].data.length === 0 && state.role === "manager") {
        return seedDatabase().then(loadAll);
      }
      state.contractors = results[4].data || {};
      state.clients = results[0].data;
      state.jobs = results[1].data.map(jobFromRow);
      var subsObj = {};
      results[2].data.forEach(function (r) { subsObj[r.job_id] = submissionFromRow(r); });
      state.submissions = subsObj;
      state.invoices = results[3].data.map(invoiceFromRow);
      state.loading = false;
      render();
    }).catch(function (err) {
      state.loading = false;
      state.loadError = (err && err.message) ? err.message : "Couldn't reach the database.";
      render();
    });
  }

  // Contractors never receive client names or contact info: only the address of each job.
  function loadContractor() {
    return Promise.all([
      dbq(sb.rpc("contractor_jobs")),
      dbq(sb.from("job_submissions").select("*"))
    ]).then(function (results) {
      var rows = results[0].data || [];
      var addresses = {};
      rows.forEach(function (r) { addresses[r.client_id] = r.address; });
      state.clients = Object.keys(addresses).map(function (id) { return { id: id, address: addresses[id] }; });
      state.jobs = rows.map(jobFromRow);
      var subsObj = {};
      results[1].data.forEach(function (r) { subsObj[r.job_id] = submissionFromRow(r); });
      state.submissions = subsObj;
      state.invoices = [];
      state.loading = false;
      render();
    }).catch(function (err) {
      state.loading = false;
      state.loadError = (err && err.message) ? err.message : "Couldn't reach the database.";
      render();
    });
  }

  // The pay page a client reaches from a text or email. No login: the token in the link is the key.
  function loadPayPage() {
    state.loading = true;
    state.loadError = "";
    render();
    return dbq(sb.rpc("invoice_by_token", { p_token: state.payToken })).then(function (res) {
      var bill = res.data;
      if (!bill) throw new Error("This bill link isn't valid. Ask the business to send it again.");
      state.invoices = [invoiceFromRow(bill.invoice)];
      state.clients = [bill.client];
      state.jobs = bill.jobs.map(jobFromRow);
      state.contractors = bill.contractors || {};
      state.submissions = {};
      bill.submissions.forEach(function (r) { state.submissions[r.job_id] = submissionFromRow(r); });
      state.loading = false;
      render();
    }).catch(function (err) {
      state.loading = false;
      state.loadError = err && err.message ? err.message : "Couldn't load this bill.";
      render();
    });
  }

  function resetDemo(btn) {
    withBusy(btn, "Resetting…", function () {
      return dbq(sb.from("invoices").delete().not("id", "is", null))
        .then(function () { return dbq(sb.from("job_submissions").delete().not("job_id", "is", null)); })
        .then(function () { return dbq(sb.from("jobs").delete().not("id", "is", null)); })
        .then(function () { return dbq(sb.from("clients").delete().not("id", "is", null)); })
        .then(seedDatabase)
        .then(function () {
          state.view = "list";
          state.activeJobId = null;
          return loadAll();
        });
    });
  }

  // ---------- login ----------

  function loginEmail(username) {
    var name = (username || "").trim().toLowerCase();
    return name.indexOf("@") === -1 ? name + "@" + LOGIN_EMAIL_DOMAIN : name;
  }

  function showLoginError(msg) {
    state.currentUser = null;
    state.loginError = msg;
    state.loading = false;
    render();
  }

  // Reads who this login is (role, name, which client) from the profiles table.
  function startSession(user) {
    return dbq(sb.from("profiles").select("*").eq("id", user.id).maybeSingle()).then(function (res) {
      var p = res.data;
      if (!p) {
        sb.auth.signOut();
        return showLoginError("This login isn't set up yet. Ask the office to add it.");
      }
      state.currentUser = { username: p.username, role: p.role, displayName: p.display_name, clientId: p.client_id };
      state.role = p.role;
      state.loginError = "";
      state.view = "list";
      return loadAll();
    });
  }

  function attemptLogin(username, password, btn) {
    withBusy(btn, "Logging in…", function () {
      return sb.auth.signInWithPassword({ email: loginEmail(username), password: password }).then(function (res) {
        if (res.error) {
          var bad = /invalid/i.test(res.error.message || "");
          return showLoginError(bad ? "Incorrect username or password." : "Couldn't log in: " + res.error.message);
        }
        return startSession(res.data.user);
      });
    });
  }

  function logout() {
    sb.auth.signOut().finally(function () {
      state.currentUser = null;
      state.role = null;
      state.loginError = "";
      state.clients = []; state.jobs = []; state.submissions = {}; state.invoices = []; state.contractors = {};
      render();
    });
  }

  function renderLogin() {
    return '' +
      '<div class="login-wrap"><div class="login-card">' +
        '<h1>ServiceOps</h1><p class="muted" style="margin:0 0 24px;">Sign in to continue</p>' +
        '<form id="loginForm">' +
          '<div class="field"><label for="loginUser">Username</label>' +
            '<input type="text" id="loginUser" autocapitalize="none" autocomplete="username" placeholder="Username or email"></div>' +
          '<div class="field"><label for="loginPass">Password</label>' +
            '<input type="password" id="loginPass" autocomplete="current-password"></div>' +
          '<div class="login-error">' + esc(state.loginError) + '</div>' +
          '<button type="submit" class="btn btn-water" id="loginBtn">Log in</button>' +
        '</form>' +
      '</div></div>';
  }

  function renderTopbar() {
    var user = state.currentUser;
    return '' +
      '<header class="topbar">' +
        '<button class="brand" id="homeBtn" type="button">ServiceOps</button>' +
        '<div class="who"><span class="name">' + esc(user ? user.displayName : "") + '</span>' +
          '<button class="chipbtn" id="refreshBtn">Refresh</button>' +
          '<button class="chipbtn" id="logoutBtn">Log out</button></div>' +
      '</header>';
  }

  // ---------- contractor ----------

  function draftKey(jobId) { return "po_draft_" + jobId; }

  function saveDraft() {
    var d = state.draft;
    if (!d) return;
    // Only photos that finished uploading survive a reload; local previews can't be stored.
    save(draftKey(state.activeJobId), {
      checklist: d.checklist, notes: d.notes,
      photos: d.photos.filter(function (p) { return p.status === "done"; }).map(function (p) { return p.url; })
    });
  }

  function openJob(jobId) {
    var existing = state.submissions[jobId];
    var job = jobById(jobId);
    var stored = job && job.status === "pending" ? load(draftKey(jobId), null) : null;
    var base = stored || existing || { checklist: {}, notes: "", photos: [] };
    state.activeJobId = jobId;
    state.draft = {
      checklist: JSON.parse(JSON.stringify(base.checklist || {})),
      notes: base.notes || "",
      photos: (base.photos || []).map(function (url) { return { url: url, status: "done" }; }),
      geo: existing ? existing.geo : null,
      timestamp: existing ? existing.timestamp : null
    };
    state.view = "detail";
    render();
    window.scrollTo(0, 0);
  }

  function renderContractorList() {
    var myJobs = state.jobs.filter(function (j) {
      return !j.assignedTo || j.assignedTo === state.currentUser.username;
    });
    var todo = myJobs.filter(function (j) { return j.status === "pending"; });
    var done = myJobs.filter(function (j) { return j.status !== "pending"; });

    var html = '<h1 class="page-title">' + (todo.length ? todo.length + (todo.length === 1 ? " job" : " jobs") + " to do" : "All done") + '</h1>' +
      '<p class="page-sub">Tap a job to take photos and tick off the steps.</p>';
    if (!myJobs.length) html += '<div class="empty">No jobs assigned to you yet.</div>';
    todo.concat(done).forEach(function (job) {
      var client = clientById(job.clientId) || {};
      var photos = photosOf(job.id);
      var label = job.status === "pending" ? "To do" : job.status === "submitted" ? "Sent to office" : job.status === "approved" ? "Approved" : "Billed";
      html += '<button class="jobrow" data-open="' + esc(job.id) + '">' +
        (photos.length ? '<img class="thumb" src="' + esc(photos[photos.length - 1]) + '" alt="">' : '') +
        '<span class="txt"><b>' + esc(client.address) + '</b><span class="line">' + esc(serviceLabel(job)) + '</span></span>' +
        '<span class="status ' + esc(job.status) + '">' + label + '</span>' +
      '</button>';
    });
    return html;
  }

  function photoCaption(i, total) {
    if (total < 2) return "";
    if (i === 0) return "Before";
    if (i === total - 1) return "After";
    return "";
  }

  function renderFilm(readonly) {
    var photos = state.draft.photos;
    if (!photos.length) return '<div class="none">' + (readonly ? "No photos." : "Photos you take show up here.") + '</div>';
    return photos.map(function (p, i) {
      var tag = p.status === "uploading" ? "Saving…" : p.status === "failed" ? "Tap to retry" : photoCaption(i, photos.length);
      var img = '<img src="' + esc(p.preview || p.url) + '" alt="Photo ' + (i + 1) + '">';
      return '<div class="ph ' + p.status + '">' +
        (p.status === "failed" ? '<button data-retry="' + i + '" aria-label="Retry upload">' + img + '</button>' : img) +
        (tag ? '<span class="tag">' + tag + '</span>' : '') +
      '</div>';
    }).join("");
  }

  function submitState() {
    var photos = state.draft.photos;
    var uploading = photos.some(function (p) { return p.status === "uploading"; });
    var failed = photos.some(function (p) { return p.status === "failed"; });
    var ready = photos.filter(function (p) { return p.status === "done"; }).length;
    if (uploading) return { ok: false, why: "Waiting for photos to finish saving…" };
    if (failed) return { ok: false, why: "A photo didn't save. Tap it to try again." };
    if (!ready) return { ok: false, why: "Take at least one photo to send." };
    return { ok: true, why: "" };
  }

  function cameraCount() {
    var n = state.draft.photos.length;
    return n === 0 ? "Take a before photo" : n === 1 ? "Now an after photo" : n + " photos";
  }

  // Updates the photo strip and button without re-rendering, so typing in notes isn't interrupted.
  function refreshDetailBits() {
    var film = document.getElementById("film");
    if (!film || !state.draft) return;
    film.innerHTML = renderFilm(false);
    bindRetry();
    var count = document.getElementById("camCount");
    if (count) count.textContent = cameraCount();
    var s = submitState();
    var btn = document.getElementById("submitBtn");
    if (btn) btn.disabled = !s.ok;
    var why = document.getElementById("submitWhy");
    if (why) why.textContent = s.why;
  }

  function renderJobDetail() {
    var job = jobById(state.activeJobId);
    var client = clientById(job.clientId) || {};
    var checklist = CHECKLISTS[job.serviceType] || [];
    var draft = state.draft;
    var readonly = job.status !== "pending";
    var ticked = checklist.filter(function (item, i) { return draft.checklist[i]; }).length;

    // Contractors see the address and the work, never the client's name or contact info.
    var head = '<b>' + esc(client.address) + '</b><span>' + esc(serviceLabel(job)) + '</span>';
    var cam = readonly
      ? '<div class="cam readonly"><button class="back" id="backBtn">Back</button><span class="lbl">' + head + '</span></div>'
      : '<button class="cam" id="camBtn" aria-label="Take photo">' +
          '<span class="lbl">' + head + '</span>' +
          '<span class="ring"><i></i></span>' +
          '<span class="count" id="camCount">' + cameraCount() + '</span>' +
        '</button>' +
        '<input type="file" accept="image/*" capture="environment" multiple id="photoInput" hidden>';

    var html = '<div class="jobgrid"><div>' + (readonly ? cam : '<div style="position:relative">' + cam + '<button class="back" id="backBtn">Back</button></div>') +
      '<div class="film" id="film">' + renderFilm(readonly) + '</div></div><div>';

    if (job.notes) html += '<div class="note-box"><b>From the office:</b> ' + esc(job.notes) + '</div>';

    html += '<div class="section-title" style="margin-top:8px;">Steps <span class="muted small" style="font-weight:500">' + ticked + ' of ' + checklist.length + '</span></div>';
    checklist.forEach(function (item, i) {
      html += '<button class="check" data-idx="' + i + '" aria-pressed="' + (draft.checklist[i] ? "true" : "false") + '"' + (readonly ? " disabled" : "") + '>' +
        '<span class="tick">' + TICK + '</span>' + esc(item) + '</button>';
    });

    html += '<div class="field" style="margin-top:12px;"><label for="notesField">Notes for the office</label>' +
      '<textarea id="notesField" placeholder="Anything the office should know…" ' + (readonly ? "disabled" : "") + '>' + esc(draft.notes) + '</textarea></div>';

    if (draft.timestamp && readonly) {
      html += '<p class="stamp">Sent ' + esc(new Date(draft.timestamp).toLocaleString()) + (draft.geo ? " · GPS " + esc(draft.geo.lat) + ", " + esc(draft.geo.lng) : " · location unavailable") + '</p>';
    } else if (!readonly) {
      html += '<p class="stamp">Time and location are added when you send.</p>';
    }

    if (!readonly) {
      var s = submitState();
      html += '<div class="sticky-cta"><button class="btn btn-water" id="submitBtn" ' + (s.ok ? "" : "disabled") + '>Send to office</button>' +
        '<p class="stamp" id="submitWhy" style="text-align:center;margin-bottom:0;">' + esc(s.why) + '</p></div>';
    } else {
      html += '<div class="sticky-cta"><button class="btn btn-soft" disabled>' + (job.status === "submitted" ? "Waiting for the office to check" : job.status === "approved" ? "Approved" : "Billed") + '</button></div>';
    }
    html += '</div></div>';
    return html;
  }

  function resizeToBlob(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1280 / img.width);
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) { cb(blob); }, "image/jpeg", 0.8);
      };
      img.onerror = function () { cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }

  // Photos go to Supabase Storage as soon as they're taken, so nothing is lost if the phone dies before sending.
  function uploadPhoto(photo, jobId) {
    photo.status = "uploading";
    refreshDetailBits();
    var path = jobId + "/" + token() + ".jpg";
    return dbq(sb.storage.from(PHOTO_BUCKET).upload(path, photo.blob, { contentType: "image/jpeg" })).then(function () {
      photo.url = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
      photo.status = "done";
      delete photo.blob;
      saveDraft();
    }).catch(function (err) {
      console.error(err);
      photo.status = "failed";
      toast(navigator.onLine === false ? "You're offline. The photo will save when you tap it again." : "A photo didn't save. Tap it to try again.", true);
    }).then(function () {
      if (state.view === "detail" && state.activeJobId === jobId) refreshDetailBits();
    });
  }

  function addPhotos(files) {
    var jobId = state.activeJobId;
    Array.prototype.forEach.call(files, function (file) {
      resizeToBlob(file, function (blob) {
        if (!blob) { toast("Couldn't read that photo. Try taking it again.", true); return; }
        var photo = { blob: blob, preview: URL.createObjectURL(blob), status: "uploading" };
        state.draft.photos.push(photo);
        uploadPhoto(photo, jobId);
      });
    });
  }

  function submitJob(btn) {
    var job = jobById(state.activeJobId);
    var draft = state.draft;
    withBusy(btn, "Sending…", function () {
      return new Promise(function (resolve) {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          function (pos) { resolve({ lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) }); },
          function () { resolve(null); },
          { timeout: 4000 }
        );
      }).then(function (geo) {
        var stamp = new Date().toISOString();
        var urls = draft.photos.filter(function (p) { return p.status === "done"; }).map(function (p) { return p.url; });
        // One server-side call saves the work and marks the job sent; contractors can't edit jobs directly.
        return dbq(sb.rpc("submit_job", { p_job_id: job.id, p: {
          checklist: draft.checklist,
          notes: draft.notes,
          photos: urls,
          geo_lat: geo ? geo.lat : null,
          geo_lng: geo ? geo.lng : null,
          submitted_at: stamp
        } })).then(function () {
          state.submissions[job.id] = { checklist: draft.checklist, notes: draft.notes, photos: urls, geo: geo, timestamp: stamp };
          job.status = "submitted";
          forget(draftKey(job.id));
          state.view = "list";
          render();
          toast("Sent to the office");
        });
      });
    });
  }

  // ---------- owner ----------

  function renderReviewCard(job) {
    var client = clientById(job.clientId) || {};
    var sub = state.submissions[job.id] || { photos: [], checklist: {} };
    var photos = sub.photos || [];
    var steps = (CHECKLISTS[job.serviceType] || []).length;

  // Asks the server to text/email the bill. Anything it couldn't send falls back to the owner's own phone.
  function deliverBill(inv, channels) {
    return sb.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      return fetch("/api/send-invoice", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + (session ? session.access_token : "") },
        body: JSON.stringify({ invoiceId: inv.id, channels: channels })
      });
    }).then(function (r) {
      return r.json().catch(function () { return {}; });
    }).catch(function () { return {}; }).then(function (data) {
      var results = data.results || {};
      var sent = channels.filter(function (c) { return results[c] === "sent"; });
      var missed = channels.filter(function (c) { return results[c] !== "sent"; });
      sent.forEach(function (c) { if (inv.sentVia.indexOf(c) === -1) inv.sentVia.push(c); });
      if (missed.length) {
        state.fallback[inv.id] = { channels: missed, message: billMessage(inv) };
      } else {
        delete state.fallback[inv.id];
      }
      return { sent: sent, missed: missed };
    });
  }

  function sendBill(clientId, btn) {
    var client = clientById(clientId) || {};
    var jobs = state.jobs.filter(function (j) { return j.status === "approved" && j.clientId === clientId && !state.billSkip[j.id]; });
    var channels = state.billVia[clientId] || preferredChannels(client);
    if (!jobs.length) { toast("Pick at least one job to bill."); return; }
    if (!channels.length) { toast("Add a phone number or email for " + (client.name || "this client") + " first."); return; }

    var jobIds = jobs.map(function (j) { return j.id; });
    var subtotal = round2(jobs.reduce(function (sum, j) { return sum + (Number(j.price) || 0); }, 0));
    var row = {
      id: "inv_" + Date.now() + "_" + clientId,
      client_id: clientId,
      job_ids: jobIds,
      pay_method: "ach",
      subtotal: subtotal,
      surcharge: 0,
      total: subtotal,
      sent_at: new Date().toISOString(),
      status: "sent",
      pay_token: token(),
      sent_via: []
    };

    withBusy(btn, "Sending…", function () {
      return dbq(sb.from("invoices").insert(row)).then(function () {
        return dbq(sb.from("jobs").update({ status: "invoiced" }).in("id", jobIds)).catch(function (err) {
          // Don't leave a bill behind for jobs that are still marked as unbilled.
          return sb.from("invoices").delete().eq("id", row.id).then(function () { throw err; });
        });
      }).then(function () {
        var inv = invoiceFromRow(row);
        state.invoices.push(inv);
        jobIds.forEach(function (id) { jobById(id).status = "invoiced"; delete state.billSkip[id]; });
        return deliverBill(inv, channels);
      }).then(function (outcome) {
        render();
        if (!outcome.missed.length) toast("Bill sent to " + client.name + " by " + channelWords(outcome.sent));
        else toast("Bill saved. Send it from your phone below.");
      });
    });
  }

  function resendBill(invoiceId, btn) {
    var inv = invoiceById(invoiceId);
    var client = clientById(inv.clientId) || {};
    var channels = state.billVia[inv.clientId] || preferredChannels(client);
    withBusy(btn, "Sending…", function () {
      return deliverBill(inv, channels).then(function (outcome) {
        render();
        if (!outcome.missed.length) toast("Sent again by " + channelWords(outcome.sent));
        else toast("Couldn't send automatically. Use the buttons below.");
      });
    });
  }

  function copyLink(invoiceId) {

    if (navigator.clipboard && navigator.clipboard.writeText) {

        inv.photosExpireAt = expires;

  function bindNewJob() {
    var form = document.getElementById("newJobForm");
    if (!form) return;
    var clientSel = document.getElementById("njClient");
    var pref = "sms";

    function setPref(value) {
      pref = value;
      document.querySelectorAll("[data-pref]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-pref") === value); });
      var help = { sms: "They'll get a text with photos and a pay link.", email: "They'll get an email with photos and a pay link.", both: "They'll get both a text and an email." };
      document.getElementById("njPrefHelp").textContent = help[value];
    }
    function fillFromClient() {
      var isNew = clientSel.value === "__new";
      document.getElementById("njNewClient").hidden = !isNew;
      var c = isNew ? {} : clientById(clientSel.value) || {};
      document.getElementById("njPhone").value = c.phone || "";
      document.getElementById("njEmail").value = c.email || "";
      setPref(c.preferred_contact || "sms");
      if (isNew) document.getElementById("njName").focus();
    }
    clientSel.addEventListener("change", fillFromClient);
    document.querySelectorAll("[data-pref]").forEach(function (b) {
      b.addEventListener("click", function () { setPref(b.getAttribute("data-pref")); });
    });
    document.getElementById("njService").addEventListener("change", function (e) {
      document.getElementById("njPrice").value = PRICES[e.target.value].defaultPrice;
    });
    fillFromClient();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var err = document.getElementById("njError");
      var isNew = clientSel.value === "__new";
      var phone = document.getElementById("njPhone").value.trim();
      var email = document.getElementById("njEmail").value.trim();
      var name = isNew ? document.getElementById("njName").value.trim() : "";
      var address = isNew ? document.getElementById("njAddress").value.trim() : "";
      var price = parseFloat(document.getElementById("njPrice").value);

      var problem = "";
      if (isNew && !name) problem = "Enter the client's name.";
      else if (isNew && !address) problem = "Enter the address.";
      else if (!phone && !email) problem = "Add a phone number or email so the bill can reach them.";
      else if ((pref === "sms" || pref === "both") && phone && digits(phone).replace(/\D/g, "").length < 10) problem = "That phone number looks too short.";
      else if ((pref === "sms" || pref === "both") && !phone) problem = "Add a phone number to send bills by text.";
      else if ((pref === "email" || pref === "both") && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) problem = "Add a valid email to send bills by email.";
      else if (isNaN(price) || price < 0) problem = "Enter a price.";
      err.textContent = problem;
      if (problem) return;

      createJob({
        isNew: isNew,
        clientId: isNew ? "c" + Date.now() : clientSel.value,
        name: name, address: address, phone: phone, email: email, pref: pref,
        serviceType: document.getElementById("njService").value,
        price: round2(price),
        assignedTo: document.getElementById("njAssignee").value,
        notes: document.getElementById("njNotes").value.trim()
      }, document.getElementById("createJobBtn"));
    });
  }

  function createJob(f, btn) {
    var contact = { phone: f.phone || null, email: f.email || null, preferred_contact: f.pref };
    var jobRow = { id: "j" + Date.now(), client_id: f.clientId, service_type: f.serviceType, status: "pending", price: f.price, notes: f.notes, assigned_to: f.assignedTo };
    withBusy(btn, "Adding…", function () {
      var saveClient = f.isNew
        ? dbq(sb.from("clients").insert({ id: f.clientId, name: f.name, address: f.address, phone: contact.phone, email: contact.email, preferred_contact: contact.preferred_contact }))
        : dbq(sb.from("clients").update(contact).eq("id", f.clientId));
      return saveClient.then(function () {
        return dbq(sb.from("jobs").insert(jobRow));
      }).then(function () {
        if (f.isNew) state.clients.push({ id: f.clientId, name: f.name, address: f.address, phone: contact.phone, email: contact.email, preferred_contact: contact.preferred_contact });
        else { var c = clientById(f.clientId); c.phone = contact.phone; c.email = contact.email; c.preferred_contact = contact.preferred_contact; }
        state.jobs.push(jobFromRow(jobRow));
        state.view = "list";
        render();
        toast("Job added for " + (clientById(f.clientId) || {}).name);
      });
    });
  }

  // ---------- client bill ----------

  function renderBill(inv, wide) {
    var client = clientById(inv.clientId) || {};
    var jobs = inv.jobIds.map(jobById).filter(Boolean);
    var photos = [];
    var deleted = false;
    jobs.forEach(function (j) {
      var sub = state.submissions[j.id];
      if (sub && sub.photosDeletedAt) deleted = true;
      photosOf(j.id).forEach(function (p) { photos.push(p); });
    });
    var paid = inv.status === "paid";
    var method = state.payMethod[inv.id] || "bank";
    var fee = method === "card" ? cardFee(inv.subtotal) : 0;
    var total = paid ? inv.total : round2(inv.subtotal + fee);
    var title = jobs.length === 1 ? serviceLabel(jobs[0]) + " done" : "Your service is done";
    var who = jobs.length && jobs[0].assignedTo ? contractorLabel(jobs[0].assignedTo) : "";
    var sub0 = jobs.length && state.submissions[jobs[0].id];
    var meta = esc(BUSINESS_NAME) + ' · ' + esc(shortDate(sub0 && sub0.timestamp ? sub0.timestamp : inv.sentAt)) + (who ? ' · ' + esc(who) : '');

    var hero = photos.length
      ? '<div class="hero"><img src="' + esc(photos[photos.length - 1]) + '" alt="Photo of the finished work"><div class="over"><b>' + esc(title) + '</b><span>' + meta + '</span></div></div>'
      : '<div class="hero nophoto"><b>' + esc(title) + '</b><span>' + meta + '</span></div>';
    var rest = photos.length > 1 ? '<div class="grid">' + photos.slice(0, -1).map(function (p) { return '<img src="' + esc(p) + '" alt="Job photo">'; }).join("") + '</div>' : '';

    var photoNote;
    if (deleted) photoNote = "Photos were removed " + PHOTO_KEEP_DAYS + " days after payment.";
    else if (paid && inv.photosExpireAt) photoNote = "Photos are kept until " + shortDate(inv.photosExpireAt) + ". Save any you want to keep.";
    else photoNote = "Photos are kept for " + PHOTO_KEEP_DAYS + " days after you pay.";

    var right = '<div class="total">' + money(total) + '</div>' +
      '<p class="muted" style="margin:0;">' + esc(client.address) + '</p>' +
      '<div class="lines">' +
        jobs.map(function (j) { return '<div><span>' + esc(serviceLabel(j)) + '</span><span>' + money(j.price) + '</span></div>'; }).join("") +
        (paid && inv.surcharge ? '<div><span>Card fee</span><span>' + money(inv.surcharge) + '</span></div>' : '') +
        (!paid && fee ? '<div><span>Card fee (3%)</span><span>' + money(fee) + '</span></div>' : '') +
        '<div class="t"><span>Total</span><span>' + money(total) + '</span></div>' +
      '</div>';
    if (paid) {
      right += '<div class="paidnote"><b>Paid ' + esc(shortDate(inv.paidAt)) + '.</b> Thank you!</div>';
    } else {
      right += '<div class="opts" role="group" aria-label="How to pay">' +
        '<button data-method="bank" data-inv="' + esc(inv.id) + '" aria-pressed="' + (method === "bank") + '"><span>Bank transfer<small>No fee</small></span><span>' + money(inv.subtotal) + '</span></button>' +
        '<button data-method="card" data-inv="' + esc(inv.id) + '" aria-pressed="' + (method === "card") + '"><span>Card<small>3% card fee: ' + money(cardFee(inv.subtotal)) + '</small></span><span>' + money(round2(inv.subtotal + cardFee(inv.subtotal))) + '</span></button>' +
      '</div>' +
      '<button class="btn btn-water" data-stripe-pay="' + esc(inv.id) + '">Pay ' + money(total) + (method === "card" ? " by card" : " by bank") + '</button>';
    }
    right += '<p class="muted small" style="margin-top:12px;">' + esc(photoNote) + '</p>';

    return '<section class="bill' + (wide ? " wide" : "") + '"><div>' + hero + rest + '</div><div>' + right + '</div></section>';
  }

  function renderClientView() {
    var clientId = state.currentUser.clientId;
    var ongoing = state.jobs.filter(function (j) { return j.clientId === clientId && (j.status === "pending" || j.status === "submitted" || j.status === "approved"); });
    var mine = state.invoices.filter(function (i) { return i.clientId === clientId; })
      .sort(function (a, b) { return new Date(b.sentAt) - new Date(a.sentAt); });
    var tab = state.clientTab === "coming" ? "coming" : "bills";
    var html = '<nav class="tabnav" aria-label="Sections">' +
      '<button type="button" data-tab="bills" aria-pressed="' + (tab === "bills") + '">Bills (' + mine.length + ')</button>' +
      '<button type="button" data-tab="coming" aria-pressed="' + (tab === "coming") + '">Coming up (' + ongoing.length + ')</button></nav>';
    if (tab === "bills") {
      html += '<h1 class="page-title">Your bills</h1><p class="page-sub">Photos of each visit and what you owe.</p>';
      if (!mine.length) html += '<div class="empty">No bills yet. They show up here after your next service.</div>';
      mine.forEach(function (inv) { html += renderBill(inv, true); });
    } else {
      html += '<h1 class="page-title">Coming up</h1><p class="page-sub">Visits scheduled or being checked.</p>';
      if (!ongoing.length) html += '<div class="empty">Nothing scheduled right now.</div>';
      ongoing.forEach(function (j) {
        var label = j.status === "pending" ? "Scheduled" : j.status === "submitted" ? "Done, being checked" : "Done, bill coming";
        html += '<div class="jobrow" style="cursor:default"><span class="txt"><b>' + esc(serviceLabel(j)) + '</b><span class="line">' + esc(contractorLabel(j.assignedTo)) + '</span></span><span class="status ' + esc(j.status) + '">' + label + '</span></div>';
      });
    }
    return html;
  }

  function startStripeCheckout(invoiceId, btn) {
    var inv = invoiceById(invoiceId);
    var method = state.payMethod[invoiceId] || "bank";
    withBusy(btn, "Opening secure checkout…", function () {
      return fetch("/api/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ payToken: inv.payToken, invoiceId: inv.id, method: method === "card" ? "card" : "ach" })
      }).then(function (r) {
        return r.json().catch(function () { return {}; });
      }).then(function (data) {
        if (!data.url) {
          var err = new Error(data.error || "the payment service didn't respond");
          err.userMessage = "Couldn't open checkout: " + err.message + ". Please try again.";
          throw err;
        }
        window.location.href = data.url;
      });
    });
  }

  // ---------- render ----------

  function render() {
    var app = document.getElementById("app");

    if (state.payToken) {
      if (state.loading) { app.innerHTML = '<main><p class="page-sub" style="margin-top:40px;">Loading your bill…</p></main>'; return; }
      if (state.loadError) {
        app.innerHTML = '<main><h1 class="page-title" style="margin-top:40px;">Bill not found</h1><p class="page-sub">' + esc(state.loadError) + '</p>' +
          '<button class="btn btn-soft btn-small" id="retryBtn">Try again</button></main>';
        bind();
        return;
      }
      app.innerHTML = '<main class="payw" style="padding-top:20px;">' + renderBill(state.invoices[0], true) + '</main>';
      bind();
      return;
    }

    if (!state.currentUser) {
      // Still checking for a saved login: don't flash the login form.
      if (state.loading) { app.innerHTML = '<main><p class="page-sub" style="margin-top:40px;">Loading…</p></main>'; return; }
      app.innerHTML = renderLogin();
      bind();
      return;
    }

    if (state.loading) {
      app.innerHTML = renderTopbar() + '<main><p class="page-sub">Loading…</p></main>';
      bind();
      return;
    }
    if (state.loadError) {
      app.innerHTML = renderTopbar() + '<main><div class="empty">Couldn\'t reach the database: ' + esc(state.loadError) + '<div style="margin-top:12px;"><button class="btn btn-soft btn-small" id="retryBtn">Try again</button></div></div></main>';
      bind();
      return;
    }

    var body = "";
    var cls = "";
    if (state.role === "contractor") {
      if (state.view === "detail") { body = renderJobDetail(); cls = "job"; }
      else body = renderContractorList();
    } else if (state.role === "client") {
      body = renderClientView();
      cls = "payw";
    } else {
      if (state.view === "newjob") body = renderNewJob();
      else { body = renderManagerHome(); cls = "wide"; }
    }

    app.innerHTML = renderTopbar() + '<main class="' + cls + '">' + body + '</main>';
    bind();
  }

  function bindRetry() {
    document.querySelectorAll("[data-retry]").forEach(function (b) {
      b.addEventListener("click", function () {
        var photo = state.draft.photos[Number(b.getAttribute("data-retry"))];
        if (photo && photo.blob) uploadPhoto(photo, state.activeJobId);
      });
    });
  }

  function on(id, event, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(event, fn);
  }
  function onAll(attr, fn) {
    document.querySelectorAll("[" + attr + "]").forEach(function (el) {
      el.addEventListener("click", function (e) { fn(el.getAttribute(attr), el, e); });
    });
  }

  function goHome() {
    state.view = "list";
    state.clientTab = "bills";
    render();
    window.scrollTo(0, 0);
  }

  function bind() {
    on("homeBtn", "click", goHome);
    onAll("data-tab", function (t) { state.clientTab = t; render(); window.scrollTo(0, 0); });
    on("loginForm", "submit", function (e) {
      e.preventDefault();
      attemptLogin(document.getElementById("loginUser").value, document.getElementById("loginPass").value, document.getElementById("loginBtn"));
    });
    on("logoutBtn", "click", logout);
    on("refreshBtn", "click", function () { state.view = "list"; loadAll(); });
    on("retryBtn", "click", function () { if (state.payToken) loadPayPage(); else loadAll(); });
    on("resetBtn", "click", function (e) { resetDemo(e.currentTarget); });
    on("newJobBtn", "click", function () { state.view = "newjob"; render(); window.scrollTo(0, 0); });
    on("backBtn", "click", function () { state.view = "list"; render(); });
    bindNewJob();

    // contractor
    onAll("data-open", function (id) { openJob(id); });
    onAll("data-idx", function (idx, el) {
      if (el.disabled) return;
      state.draft.checklist[idx] = !state.draft.checklist[idx];
      saveDraft();
      render();
    });
    on("notesField", "input", function (e) { state.draft.notes = e.target.value; saveDraft(); });
    on("camBtn", "click", function () { document.getElementById("photoInput").click(); });
    on("photoInput", "change", function (e) { if (e.target.files.length) addPhotos(e.target.files); e.target.value = ""; });
    on("submitBtn", "click", function (e) { submitJob(e.currentTarget); });
    bindRetry();

    // owner
    onAll("data-approve", function (id, el) { approveJob(id, el); });
    onAll("data-redo", function (id, el) { sendBack(id, el); });
    onAll("data-billjob", function (id) { state.billSkip[id] = !state.billSkip[id]; render(); });
    onAll("data-via", function (channel, el) {
      var cid = el.getAttribute("data-client");
      var current = (state.billVia[cid] || preferredChannels(clientById(cid))).slice();
      var at = current.indexOf(channel);
      if (at === -1) current.push(channel); else current.splice(at, 1);
      state.billVia[cid] = current;
      render();
    });
    onAll("data-sendbill", function (cid, el) { sendBill(cid, el); });
    onAll("data-resend", function (id, el) { resendBill(id, el); });
    onAll("data-copylink", function (id) { copyLink(id); });
    onAll("data-markpaid", function (id, el) { markInvoicePaid(id, el); });

    // client
    onAll("data-method", function (method, el) { state.payMethod[el.getAttribute("data-inv")] = method; render(); });
    onAll("data-stripe-pay", function (id, el) { startStripeCheckout(id, el); });
  }

  if (params.get("paid") === "success") setTimeout(function () { toast("Payment received. Thank you!"); }, 300);
  if (params.get("paid") === "cancelled") setTimeout(function () { toast("Payment cancelled. You can try again any time."); }, 300);

  if (state.payToken) loadPayPage();
  else {
    // Supabase keeps the login between visits; pick it back up if there is one.
    sb.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (session) return startSession(session.user);
      state.loading = false;
      render();
    }).catch(function () { state.loading = false; render(); });
  }
})();
</script>
</body>
</html>
